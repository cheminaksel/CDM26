<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio — Vidéaste &amp; photographe</title>
  <meta name="description" content="Portfolio vidéo et photo : clips, aftermovies, films de marque, motion design, storyboards et photographie.">
  <meta name="theme-color" content="#0b1026">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="apps.css">
</head>
<body>

  <!-- ============ ARRIVÉE : le MacBook posé sur la table ============ -->
  <div id="landing" class="landing">
    <div class="ld-scene" id="ldScene">
      <div class="ld-wall"></div>
      <div class="ld-desk"></div>
      <div class="ld-rig" id="ldRig">
        <i class="ld-glow"></i>
        <i class="ld-shadow"></i>
        <div class="ld-paper" aria-hidden="true">
          <svg viewBox="0 0 300 210">
            <rect x="6" y="6" width="288" height="198" rx="2" fill="#f4f1ea"/>
            <path d="M22 26h120M22 36h70" stroke="#9b968b" stroke-width="2.4" stroke-linecap="round"/>
            <g fill="#fbfaf6" stroke="#3b3a37" stroke-width="1.4">
              <rect x="22" y="50" width="78" height="46"/><rect x="111" y="50" width="78" height="46"/><rect x="200" y="50" width="78" height="46"/>
              <rect x="22" y="128" width="78" height="46"/><rect x="111" y="128" width="78" height="46"/><rect x="200" y="128" width="78" height="46"/>
            </g>
            <g fill="none" stroke="#55534e" stroke-width="1" stroke-linecap="round" opacity=".8">
              <path d="M24 84h74M34 84v-14h10v14M62 84v-22h12v22"/><circle cx="52" cy="70" r="3"/><path d="M52 73v8M48 84l4-4 4 4"/>
              <circle cx="150" cy="70" r="11"/><path d="M146 68h2M152 68h2M147 75q3 2 6 0M132 96l8-12M168 96l-8-12"/>
              <path d="M202 86h74M212 86v-20h14v20M236 86v-28h12v28M258 86v-16h10v16M262 64v-12M258 56l4-5 4 5" />
              <path d="M24 162h74M40 162l10-18 8 10 6-6 10 14"/><path d="M78 142a6 6 0 1 0 0.1 0"/>
              <path d="M113 168q38-24 74-2"/><path d="M180 160l7 6-9 2"/><circle cx="140" cy="148" r="3"/><path d="M140 151v9"/>
              <rect x="222" y="140" width="34" height="22" rx="3"/><path d="M232 151h14"/>
            </g>
            <g font-family="Inter,system-ui,sans-serif" font-size="7" fill="#6f6b62"><text x="24" y="106">PLAN 1 · large</text><text x="113" y="106">PLAN 2 · GP</text><text x="202" y="106">PLAN 3 · ensemble</text><text x="24" y="184">PLAN 4 · insert</text><text x="113" y="184">PLAN 5 · travelling</text><text x="202" y="184">PLAN 6 · fin</text></g>
            <g transform="rotate(-24 210 196)"><rect x="128" y="190" width="150" height="10" rx="2" fill="#f2b51c"/><rect x="128" y="190" width="150" height="3.4" fill="#ffd257"/><rect x="268" y="190" width="14" height="10" fill="#d9d9d9"/><path d="M128 190l-16 5 16 5z" fill="#e8c9a3"/><path d="M116 193.8l-4 1.2 4 1.2z" fill="#333"/></g>
          </svg>
        </div>
        <div class="ld-mac" id="ldMac" role="button" tabindex="0" aria-label="Allumer le MacBook et entrer dans le portfolio">
          <div class="ld-tilt">
            <div class="ld-lid"><div class="ld-screen" id="ldScreen"></div><i class="ld-notch"></i></div>
            <div class="ld-base"><i class="ld-spk l"></i><div class="ld-kb" id="ldKb"></div><i class="ld-spk r"></i><i class="ld-pad"></i><i class="ld-edge"></i></div>
          </div>
        </div>
        <div class="ld-cam" aria-hidden="true">
          <svg viewBox="0 0 300 220">
            <defs>
              <linearGradient id="cbF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2f33"/><stop offset="1" stop-color="#111214"/></linearGradient>
              <linearGradient id="cbT" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55565b"/><stop offset="1" stop-color="#2d2e32"/></linearGradient>
              <linearGradient id="cbS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1c1f"/><stop offset="1" stop-color="#070708"/></linearGradient>
              <radialGradient id="cbG" cx=".38" cy=".34" r=".72"><stop offset="0" stop-color="#6476c4"/><stop offset=".32" stop-color="#1f2550"/><stop offset=".72" stop-color="#07080f"/><stop offset="1" stop-color="#000"/></radialGradient>
              <pattern id="cbR" width="3.2" height="8" patternUnits="userSpaceOnUse"><rect width="1.5" height="8" fill="#2c2d31"/></pattern>
            </defs>
            <path d="M70 72L92 58H272L250 72Z" fill="url(#cbT)"/>
            <path d="M250 72L272 58V160L250 176Z" fill="url(#cbS)"/>
            <rect x="62" y="72" width="190" height="104" rx="9" fill="url(#cbF)"/>
            <path d="M208 74C236 70 252 78 254 96V160C252 172 240 176 214 176C209 150 205 110 208 74Z" fill="#18191b"/>
            <path d="M214 82C232 80 244 86 246 100" stroke="#6a6b70" stroke-opacity=".45" fill="none"/>
            <path d="M112 72L122 42H170L182 72Z" fill="#212226"/>
            <path d="M122 42L136 33H186L170 42Z" fill="#4a4b50"/>
            <path d="M170 42L186 33L196 63L182 72Z" fill="#0d0d0f"/>
            <rect x="138" y="29" width="30" height="5" rx="1" fill="#2a2b2f"/>
            <path d="M219 61v5a13 4.5 0 0 0 26 0v-5" fill="#2a2b2f"/><ellipse cx="232" cy="61" rx="13" ry="4.5" fill="#5d5e63"/>
            <ellipse cx="205" cy="63.5" rx="6.5" ry="2.6" fill="#c4c6cb"/><circle cx="216" cy="59" r="1.8" fill="#ff3b30"/>
            <path d="M88 63v4a10 3.5 0 0 0 20 0v-4" fill="#2a2b2f"/><ellipse cx="98" cy="63" rx="10" ry="3.5" fill="#4d4e53"/>
            <rect x="56" y="82" width="8" height="13" rx="2" fill="#3c3d42"/>
            <circle cx="146" cy="124" r="47" fill="#0b0b0c" stroke="#9c9ea3" stroke-width="3"/>
            <ellipse cx="141" cy="126.5" rx="45" ry="46.5" fill="#1b1c1f"/>
            <ellipse cx="136" cy="129" rx="44.5" ry="46" fill="#26272b"/>
            <ellipse cx="131" cy="131.5" rx="44" ry="45.5" fill="#121214"/>
            <ellipse cx="131" cy="131.5" rx="44" ry="45.5" fill="url(#cbR)"/>
            <ellipse cx="125" cy="134.5" rx="43" ry="45" fill="#141416"/>
            <ellipse cx="120" cy="137" rx="42" ry="44.5" fill="#2c2d31"/>
            <ellipse cx="115" cy="139.5" rx="41.5" ry="44" fill="#1c1d20" stroke="#606267" stroke-width="1.2"/>
            <ellipse cx="115" cy="139.5" rx="37" ry="39.5" fill="none" stroke="#e8e8e8" stroke-opacity=".28" stroke-width=".8"/>
            <ellipse cx="115" cy="139.5" rx="33" ry="35.5" fill="#050506"/>
            <ellipse cx="115" cy="139.5" rx="28" ry="30.5" fill="url(#cbG)"/>
            <ellipse cx="105" cy="127" rx="10" ry="5.5" fill="#fff" opacity=".2" transform="rotate(-32 105 127)"/>
            <ellipse cx="124" cy="151" rx="6" ry="3" fill="#b38bff" opacity=".28"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="ld-ui">
      <div class="ld-brand" id="ldBrand"></div>
      <button class="ld-skip" id="ldSkip" type="button">Entrer</button>
      <div class="ld-hint" id="ldHint"><span class="ld-mouse"><i></i></span><span>Scrolle ou clique sur le Mac pour entrer</span></div>
    </div>
  </div>

  <!-- ============ DÉMARRAGE ============ -->
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-logo" id="bootLogo"></div>
    <div class="boot-bar"><span id="bootFill"></span></div>
    <div class="boot-skip">Cliquer pour passer</div>
  </div>

  <!-- ============ ÉCRAN VERROUILLÉ ============ -->
  <div id="lock" class="lock">
    <div class="lock-top">
      <div class="lock-date" id="lockDate"></div>
      <div class="lock-time" id="lockTime"></div>
    </div>
    <div class="lock-user">
      <div class="avatar" id="lockAvatar"></div>
      <div class="lock-name" id="lockName"></div>
      <button class="lock-input" id="lockBtn" aria-label="Ouvrir la session">
        <span class="lock-dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="lock-go"></span>
      </button>
      <p class="lock-hint">Cliquez ou appuyez sur Entrée pour ouvrir la session</p>
    </div>
  </div>

  <!-- ============ BUREAU ============ -->
  <main id="desktop" class="desktop" aria-label="Bureau du portfolio">
    <div class="wallpaper" id="wallpaper">
      <svg class="waves" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="wvA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="wvB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        </defs>
        <path d="M-100 620C180 470 420 760 760 600S1260 380 1560 520V1000H-100Z" fill="url(#wvA)"/>
        <path d="M-100 720C260 600 520 820 860 700S1300 560 1560 660V1000H-100Z" fill="url(#wvB)"/>
        <path d="M-100 380C220 240 520 520 820 380S1240 180 1560 300" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/>
      </svg>
    </div>

    <header class="menubar" id="menubar"></header>

    <section class="widgets" id="widgets" aria-label="Widgets"></section>
    <section class="desk-icons" id="deskIcons" aria-label="Fichiers du bureau"></section>
    <div class="select-rect" id="selectRect"></div>

    <div class="windows" id="windows"></div>
    <div class="notif-stack" id="notifs" aria-live="polite"></div>

    <nav class="dock-wrap" aria-label="Dock">
      <div class="dock glass" id="dock"></div>
    </nav>

    <div class="spotlight" id="spotlight" role="dialog" aria-label="Recherche">
      <div class="sp-box glass">
        <label class="sp-input"><span class="sp-ico"></span><input id="spInput" type="text" placeholder="Rechercher un projet, une app…" autocomplete="off" spellcheck="false"></label>
        <div class="sp-results" id="spResults"></div>
      </div>
    </div>
  </main>

  <div class="dim" id="dim"></div>

  <noscript>
    <div class="noscript">Ce portfolio a besoin de JavaScript pour s'afficher.</div>
  </noscript>

  <script defer src="config.js"></script>
  <script defer src="logos.js"></script>
  <script defer src="core.js"></script>
  <script defer src="apps.js"></script>
</body>
</html>
